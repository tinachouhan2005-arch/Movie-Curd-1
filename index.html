    <div class="backDrop formClose" id="backDrop"></div>
    <div class="movie" id="movie">
        <form id="movieForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h3 class="m-0" id="addMovie">Add Movie</h3>
                    <i class="fa-solid fa-xmark fa-2x formClose" role="button"></i>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="movieName">Movie Title</label>
                                <input type="text" class="form-control" id="movieName">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="movieImg">Movie URL</label>
                                <input type="text" class="form-control" id="movieImg">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="movieRating">Movie Rating</label>
                                <select class="form-control" id="movieRating">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="movieGenre">Movie Genre </label>
                                <select class="form-control" id="movieGenre">
                                    <option>Action</option>
                                    <option>Comedy</option>
                                    <option>Drama</option>
                                    <option>Romance</option>
                                    <option>Thriller</option>
                                    <option>Horror</option>
                                    <option>Sci-Fi</option>
                                    <option>Fantasy</option>
                                    <option>Adventure</option>
                                    <option>Mystery</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="movieDescription">Movie Description</label>
                                <textarea class="form-control" rows="4" id="movieDescription"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer  d-flex justify-content-between align-items-center">
                        <button type="submit" class="btn btn-sm net-sec-btn" id="addBtn">Add Movie</button>
                         <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateBtn">Update Movie</button>
                        <button type="button" class="btn btn-sm net-pri-btn formClose">Close</button>
                    </div>
                </div>
            </div>

    </form>

    <div class="spinner d-none" id="spinner">
